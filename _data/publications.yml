- title: "Reasoning Fails Where Step Flow Breaks"
  authors: ["Xiaoyu Xu", "Yulan Pan", "Xiaosong Yuan", "Zhihong Shen", "Minghao Su", "Yuanhao Su", "Xiaofeng Zhang"]
  venue: "ACL 2026 Main Conference"
  venue_note: "CCF-A"
  image: "/images/paper1_motivation.png"
  alt_en: "Step-level saliency analysis of reasoning failures"
  alt_zh: "通过步骤级显著性分析推理失败"
  summary_en: "Long reasoning chains can lose access to earlier steps. Step-Saliency locates these information-flow failures, and StepFlow repairs them through shallow-layer attention rebalancing and deep-layer residual injection."
  summary_zh: "长链推理中，前文信息可能被忽略或逐渐衰减。Step-Saliency 定位步骤间的信息流异常，StepFlow 通过浅层注意力调整和深层步骤级残差注入修复信息流。"
  links:
    - label: "Paper"
      url: "https://aclanthology.org/2026.acl-long.1212/"
    - label: "arXiv"
      url: "https://arxiv.org/pdf/2604.06695"
    - label: "Code"
      url: "https://github.com/XiaoyuXu-Vincent/step-saliency"

- title: "Manifold-guided Geometric Enhancement for Reliable Multimodal Interaction in Consumer Electronics"
  authors: ["Xiaoyu Xu", "Yulan Pan", "Xiaofeng Zhang", "Xuhang Chen", "Kim-Fung Tsang"]
  venue: "IEEE Transactions on Consumer Electronics"
  venue_note: "JCR Q1"
  image: "/images/paper2_method.png"
  alt_en: "Manifold-guided intervention for multimodal hallucination"
  alt_zh: "用于缓解多模态幻觉的流形引导干预方法"
  summary_en: "Linear steering can mismatch the curved geometry of multimodal representations. MAGE combines geodesic guidance, visual-evidence subspace filtering, and layer-adaptive residual injection to reduce hallucinations."
  summary_zh: "多模态表征的几何结构随深度变化，统一的线性干预可能失效。MAGE 结合测地线引导、视觉证据子空间筛选和分层残差注入，减少幻觉。"
  links:
    - label: "Paper"
      url: "https://ieeexplore.ieee.org/document/11358388"

- title: "The Image Still Has a Say: Final-Answer Repair for Multimodal Chain-of-Thought"
  authors: ["Yulan Pan", "Xiaoyu Xu", "Zhihong Shen"]
  venue: "preprint"
  image: "/images/paper3_tver.png"
  alt_en: "TVER repairs the final-answer readout using visual evidence while keeping the reasoning trace fixed"
  alt_zh: "TVER 在保持推理链不变的情况下，利用视觉证据修复最终答案"
  summary_en: "We trace answer preferences and image-to-answer information flow, finding that reasoning can lock onto a wrong answer while visual evidence still favors the correct one. TVER uses this evidence to repair the final readout."
  summary_zh: "分析推理过程中的答案偏好与视觉信息流，发现模型可能提前锁定错误答案，而图像仍支持正确选项。TVER 据此在答案生成时重新分配注意力，让视觉证据参与纠错。"
  links:
    - label: "arXiv"
      url: "https://arxiv.org/abs/2610.17663"
